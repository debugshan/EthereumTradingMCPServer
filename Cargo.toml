[package]
name = "mcp_ethereum_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ethers = { version = "2.0", features = ["rustls", "ws"] }
ethers-core = "2.0"
ethers-providers = "2.0"
ethers-signers = "2.0"
ethers-contract = "2.0"
hex = "0.4"
futures = "0.3"
clap = { version = "4.0", features = ["derive"] }
url = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
