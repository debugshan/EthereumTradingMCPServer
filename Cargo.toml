[package]
name = "mcp-ethereum-server"
version = "0.1.0"
edition = "2021"
description = "MCP server for Ethereum balance queries and token swaps"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/your-username/mcp-ethereum-server"
readme = "README.md"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ethers = { version = "2.0", features = ["rustls", "ws"] }
ethers-core = "2.0"
ethers-providers = "2.0"
ethers-signers = "2.0"
ethers-contract = "2.0"
hex = "0.4"
futures = "0.3"
clap = { version = "4.0", features = ["derive"] }
url = "2.0"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk" }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
